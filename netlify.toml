[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "24"
# Fallback apenas para páginas SPA. Não usar force=true: as Functions existentes
# em /.netlify/functions/* são resolvidas pelo Netlify antes deste fallback.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[functions]
node_bundler = "esbuild"
